[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "musictrainer"
version = "0.1.0"
description = "PyQt6 frontend for MusicTrainer, backed by the Qt-free C++ core via pybind11."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "PyQt6",
]

[project.scripts]
musictrainer = "musictrainer.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
